<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구조설계 법규 검토</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dde1e6;
    --accent: #2457c5; --accent-text: #ffffff;
    --ok: #1d7a46; --ok-bg: #e5f4ea; --bad: #b42318; --bad-bg: #fdecea;
    --warn: #8a5a00; --warn-bg: #fff4d6; --na: #5d6673; --na-bg: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --panel: #1b1e23; --text: #e6e8eb; --muted: #9aa3ae; --line: #2e333a;
      --accent: #6e9bff; --accent-text: #0b0d10;
      --ok: #5fd08e; --ok-bg: #143322; --bad: #ff8a80; --bad-bg: #3a1714;
      --warn: #f3c56b; --warn-bg: #3a2e10; --na: #9aa3ae; --na-bg: #262a30;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px; text-align: center; cursor: pointer; color: var(--muted); }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .files { list-style: none; padding: 0; margin: 12px 0 0; }
  .files li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .files button { background: none; border: 0; color: var(--muted); cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); }
  input, textarea { width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  .full { grid-column: 1 / -1; }
  .run { margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  .run:disabled { opacity: .5; cursor: default; }
  .log { font-size: 13px; color: var(--muted); max-height: 220px; overflow: auto; }
  .log div { padding: 2px 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .thinking { white-space: pre-wrap; font-size: 13px; color: var(--muted); max-height: 260px; overflow: auto; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .v-적합 { color: var(--ok); background: var(--ok-bg); }
  .v-부적합 { color: var(--bad); background: var(--bad-bg); }
  .v-확인 { color: var(--warn); background: var(--warn-bg); }
  .v-해당 { color: var(--na); background: var(--na-bg); }
  .overall { font-size: 18px; padding: 4px 14px; }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .counts button { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 3px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .counts button.on { border-color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  .checks td:nth-child(1) { min-width: 140px; }
  .checks td:nth-child(2) { min-width: 160px; }
  .error { color: var(--bad); }
  .hidden { display: none; }
  .note { font-size: 13px; color: var(--muted); }
  a { color: var(--accent); }
  @media print { .no-print { display: none; } body { background: #fff; } .panel { border: 0; } }
</style>
</head>
<body>
<main>
  <h1>구조설계 법규 검토</h1>
  <p class="sub">구조 도면을 올리면 현행 건축법·구조기준(KDS 41)을 국가법령정보센터에서 확인해 위법 소지를 검토합니다.</p>

  <section class="panel no-print">
    <h2>1. 도면 올리기</h2>
    <div class="drop" id="drop">PDF 또는 이미지(PNG·JPG)를 끌어다 놓거나 눌러서 선택 — DWG는 PDF로 내보내서 올려 주세요
      <input type="file" id="picker" accept=".pdf,image/png,image/jpeg,image/webp,image/gif" multiple hidden>
    </div>
    <ul class="files" id="files"></ul>
  </section>

  <section class="panel no-print">
    <h2>2. 건축물 정보 (선택 — 비우면 도면에서 읽음)</h2>
    <div class="grid">
      <label>대지 위치<input name="location" placeholder="예: 서울특별시 강남구"></label>
      <label>건축물 용도<input name="use" placeholder="예: 업무시설, 공동주택"></label>
      <label>구조 형식<input name="structure" placeholder="예: 철근콘크리트 라멘조"></label>
      <label>층수 (지상/지하)<input name="floors" placeholder="예: 지상 7층 / 지하 2층"></label>
      <label>높이<input name="height" placeholder="예: 24.5 m"></label>
      <label>연면적<input name="area" placeholder="예: 3,200 ㎡"></label>
      <label class="full">추가 요청사항<textarea name="notes" placeholder="예: 내진설계와 기초 위주로 봐 주세요"></textarea></label>
    </div>
    <button class="run" id="run" disabled>검토 시작</button>
    <p class="note">검토에는 수 분이 걸릴 수 있습니다. 결과는 참고용이며 최종 판단은 건축구조기술사·허가권자에게 있습니다.</p>
  </section>

  <section class="panel hidden" id="progress">
    <h2>진행 상황</h2>
    <div class="log" id="log"></div>
    <details><summary>검토 과정 보기</summary><div class="thinking" id="thinking"></div></details>
  </section>

  <section class="panel hidden" id="result"></section>
</main>

<script>
const MAX_BYTES = 30 * 1024 * 1024;
const ACCEPTED = ["application/pdf", "image/png", "image/jpeg", "image/webp", "image/gif"];
const files = [];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const badge = (v, cls = "") => `<span class="badge ${cls} v-${esc(String(v).split(" ")[0])}">${esc(v)}</span>`;

function renderFiles() {
  $("files").innerHTML = files.map((f, i) =>
    `<li><span>${esc(f.name)} <span class="note">(${(f.size / 1024 / 1024).toFixed(1)} MB)</span></span><button data-i="${i}" aria-label="삭제">✕</button></li>`).join("");
  $("run").disabled = files.length === 0;
}
$("files").addEventListener("click", (e) => {
  if (e.target.dataset.i) { files.splice(Number(e.target.dataset.i), 1); renderFiles(); }
});
function addFiles(list) {
  for (const f of list) {
    if (!ACCEPTED.includes(f.type)) { alert(`지원하지 않는 형식: ${f.name}`); continue; }
    files.push(f);
  }
  const total = files.reduce((n, f) => n + f.size, 0);
  if (total > MAX_BYTES) alert("파일 합계가 30MB를 넘습니다. 도면을 나눠서 검토해 주세요.");
  renderFiles();
}
const drop = $("drop");
drop.addEventListener("click", () => $("picker").click());
$("picker").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); });

const toBase64 = (file) => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result.split(",")[1]);
  r.onerror = reject;
  r.readAsDataURL(file);
});

function log(text) {
  const div = document.createElement("div");
  div.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
  $("log").append(div);
  $("log").scrollTop = $("log").scrollHeight;
}

$("run").addEventListener("click", async () => {
  if (files.reduce((n, f) => n + f.size, 0) > MAX_BYTES) { alert("파일 합계가 30MB를 넘습니다."); return; }
  $("run").disabled = true;
  $("progress").classList.remove("hidden");
  $("result").classList.add("hidden");
  $("log").innerHTML = ""; $("thinking").textContent = "";
  log("도면을 업로드하는 중…");

  const project = {};
  document.querySelectorAll(".grid [name]").forEach((el) => { project[el.name] = el.value; });

  try {
    const payload = {
      project,
      files: await Promise.all(files.map(async (f) => ({ name: f.name, mediaType: f.type, data: await toBase64(f) }))),
    };
    const res = await fetch("/api/review", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
    log("도면을 읽고 관련 법령을 확인하는 중…");

    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const event = chunk.match(/^event: (.*)$/m)?.[1];
        const data = JSON.parse(chunk.match(/^data: (.*)$/m)?.[1] ?? "null");
        handle(event, data);
      }
    }
  } catch (err) {
    showError(err.message);
  } finally {
    $("run").disabled = files.length === 0;
  }
});

function handle(event, data) {
  if (event === "thinking") $("thinking").textContent += data.text;
  else if (event === "tool") log(data.name === "web_search" ? `법령 검색: ${data.query ?? ""}` : `조문 확인: ${data.url ?? ""}`);
  else if (event === "status") log(data.text);
  else if (event === "report") { log("검토 완료"); renderReport(data); }
  else if (event === "raw") { log("검토 완료"); showRaw(data.text); }
  else if (event === "error") showError(data.message);
}

function showError(msg) {
  log(`오류: ${msg}`);
  const el = $("result");
  el.classList.remove("hidden");
  el.innerHTML = `<p class="error">${esc(msg)}</p>`;
}
function showRaw(text) {
  const el = $("result");
  el.classList.remove("hidden");
  el.innerHTML = `<h2>검토 결과</h2><pre style="white-space:pre-wrap">${esc(text)}</pre>`;
}

let currentReport = null;
let filter = null;
function renderReport(r) {
  currentReport = r;
  const el = $("result");
  el.classList.remove("hidden");
  const counts = {};
  for (const c of r.checks) counts[c.verdict] = (counts[c.verdict] ?? 0) + 1;
  const order = ["부적합 의심", "확인 필요", "적합", "해당 없음"];
  const rows = r.checks
    .filter((c) => !filter || c.verdict === filter)
    .sort((a, b) => order.indexOf(a.verdict) - order.indexOf(b.verdict));

  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <h2 style="margin:0">검토 결과 ${badge(r.overall, "overall")}</h2>
      <span class="no-print"><button class="run" style="margin:0" onclick="window.print()">인쇄 / PDF 저장</button></span>
    </div>
    <p>${esc(r.summary)}</p>

    <div class="counts no-print">
      <button class="${!filter ? "on" : ""}" data-f="">전체 ${r.checks.length}</button>
      ${order.filter((v) => counts[v]).map((v) => `<button class="${filter === v ? "on" : ""}" data-f="${esc(v)}">${esc(v)} ${counts[v]}</button>`).join("")}
    </div>
    <div class="table-wrap"><table class="checks">
      <thead><tr><th>항목</th><th>근거 법령·기준</th><th>요구 기준</th><th>도면 값</th><th>판정</th><th>의견·보완 방법</th></tr></thead>
      <tbody>${rows.map((c) => `<tr>
        <td><div class="note">${esc(c.category)}</div>${esc(c.item)}</td>
        <td>${esc(c.legal_basis)}</td><td>${esc(c.requirement)}</td><td>${esc(c.design_value)}</td>
        <td>${badge(c.verdict)}</td><td>${esc(c.comment)}</td></tr>`).join("")}</tbody>
    </table></div>

    ${r.project_facts.length ? `<h2 style="margin-top:24px">도면에서 읽은 건축물 개요</h2>
    <div class="table-wrap"><table><thead><tr><th>항목</th><th>값</th><th>출처</th></tr></thead>
      <tbody>${r.project_facts.map((f) => `<tr><td>${esc(f.item)}</td><td>${esc(f.value)}</td><td class="note">${esc(f.source)}</td></tr>`).join("")}</tbody></table></div>` : ""}

    ${r.missing_info.length ? `<h2 style="margin-top:24px">추가로 필요한 자료</h2><ul>${r.missing_info.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>` : ""}

    ${r.references.length ? `<h2 style="margin-top:24px">확인한 법령·기준</h2><ul>${r.references.map((x) =>
      `<li>${/^https?:\/\//.test(x.url) ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)}</li>`).join("")}</ul>` : ""}
  `;
  el.querySelectorAll(".counts button").forEach((b) => b.addEventListener("click", () => {
    filter = b.dataset.f || null;
    renderReport(currentReport);
  }));
}
</script>
</body>
</html>
